<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Demo Form</h2>

    <form action="https://forminit.com/f/pf23vrhizw9" method="POST">

        <label for="name">Input 1</label>
        <input
            type="text"
            id="name"
            name="input_1"
            placeholder="Enter test name"
            required
        >

        <label for="code">Input 2</label>
        <input
            type="text"
            id="code"
            name="input_2"
            placeholder="Enter demo code"
            required
        >

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
