<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        .demo {
            text-align: center;
            color: #c62828;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Demo Login</h2>

        <div class="demo">
            DEMO — DO NOT ENTER REAL PASSWORDS
        </div>

        <form action="https://forminit.com/f/pf23vrhizw9" method="POST">

            <label for="username">Input1 — Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter test username"
                required
            >

            <label for="demo-code">Input2 — Demo Code</label>
            <input
                type="text"
                id="demo-code"
                name="demo_code"
                placeholder="Enter test code"
                required
            >

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
